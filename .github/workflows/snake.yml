name: Generate Contribution Snake

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/snake.yml

  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: Ritansh2004
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Add pause before the Snake animation restarts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          PAUSE_MS = 3500
          svg_files = [
              Path("dist/github-contribution-grid-snake.svg"),
              Path("dist/github-contribution-grid-snake-dark.svg"),
          ]

          style_tag = re.compile(r"(<style\b[^>]*>)(.*?)(</style>)", re.IGNORECASE | re.DOTALL)
          animation_duration = re.compile(
              r"(animation\s*:\s*none\s+(?:linear\s+)?)([0-9]+(?:\.[0-9]+)?)(ms)(\s+linear)?(\s+infinite)",
              re.IGNORECASE,
          )
          keyframes_start = re.compile(r"@keyframes\s+[\w-]+\s*\{", re.IGNORECASE)
          frame_rule = re.compile(r"([^{}]+)\{([^{}]*)\}", re.DOTALL)
          percentage = re.compile(r"(?<![\w.-])([0-9]+(?:\.[0-9]+)?)%")

          def add_pause_to_keyframes(css: str, factor: float) -> str:
              result = []
              cursor = 0

              for start in keyframes_start.finditer(css):
                  opening = css.find("{", start.start())
                  depth = 1
                  end = opening + 1
                  while end < len(css) and depth:
                      if css[end] == "{":
                          depth += 1
                      elif css[end] == "}":
                          depth -= 1
                      end += 1

                  if depth != 0:
                      raise RuntimeError("Unclosed @keyframes block found")

                  body = css[opening + 1:end - 1]
                  frames = list(frame_rule.finditer(body))
                  if not frames:
                      raise RuntimeError("Could not parse keyframes; refusing to publish a broken SVG")

                  rebuilt = []
                  body_cursor = 0
                  last_style = None

                  for frame in frames:
                      rebuilt.append(body[body_cursor:frame.start()])
                      selector = frame.group(1)
                      declarations = frame.group(2)
                      selector = percentage.sub(
                          lambda m: f"{float(m.group(1)) * factor:.5f}%",
                          selector,
                      )
                      rebuilt.append(f"{selector}{{{declarations}}}")
                      body_cursor = frame.end()
                      last_style = declarations

                  rebuilt.append(body[body_cursor:])
                  rebuilt.append(f"100%{{{last_style}}}")

                  result.append(css[cursor:opening + 1])
                  result.append("".join(rebuilt))
                  result.append("}")
                  cursor = end

              result.append(css[cursor:])
              return "".join(result)

          for path in svg_files:
              if not path.exists():
                  raise FileNotFoundError(f"Expected generated SVG was not found: {path}")

              svg = path.read_text(encoding="utf-8")
              styles_found = [0]

              def patch_style(match):
                  css = match.group(2)
                  durations = [float(m.group(2)) for m in animation_duration.finditer(css)]
                  if not durations:
                      return match.group(0)
                  styles_found[0] += 1
                  if max(durations) - min(durations) > 0.01:
                      raise RuntimeError(f"Unexpected different animation durations in {path}: {durations}")

                  original_ms = durations[0]
                  cycle_ms = original_ms + PAUSE_MS
                  active_ratio = original_ms / cycle_ms

                  css = add_pause_to_keyframes(css, active_ratio)
                  css, replacements = animation_duration.subn(
                      lambda m: f"{m.group(1)}{cycle_ms:g}{m.group(3)}{m.group(4) or ''}{m.group(5)}",
                      css,
                  )
                  if replacements < 2:
                      raise RuntimeError(
                          f"Expected to update both dot and snake animation durations in {path}; found {replacements}"
                      )
                  return match.group(1) + css + match.group(3)

              svg = style_tag.sub(patch_style, svg)
              if styles_found[0] == 0:
                  raise RuntimeError(f"No <style> block found in {path}")

              ET.fromstring(svg)
              path.write_text(svg, encoding="utf-8")
              print(f"Added {PAUSE_MS}ms end pause to {path}")
          PY

      - name: Publish Snake Animation
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
